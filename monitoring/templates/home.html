{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>DOST SETUP Dashboard</title>
</head>
<body class="bg-[#f8fafb]">

    <div class="flex flex-col items-start overflow-hidden">

        <!-- ============================== -->
        <!-- TOP NAVBAR                      -->
        <!-- ============================== -->
        <header class="w-full h-[70px] flex items-center gap-2.5 border border-[#a3a3a3] bg-white px-6 py-3.5">

            <!-- Logo -->
            <img
                src="{% static 'monitoring/images/image-30.png' %}"
                class="w-12 h-[47px] object-cover"
                alt="DOST logo"
            >

            <span class="w-[70px] font-['Gotham-Black',_sans-serif] text-base font-black text-black">
                DOST SARGEN
            </span>

            <img src="{% static 'monitoring/icons/line0.svg' %}" class="w-1.5 h-[36px]" alt="">

            <span class="w-[178px] font-['Gotham-Black',_sans-serif] text-base font-black text-[#1e3466]">
                SETUP Projects Management System
            </span>

            <!-- Partner logo -->
            <img
                src="{% static 'monitoring/images/image-40.png' %}"
                class="w-[136px] h-[45px] object-cover"
                alt="Partner logo"
            >

            <!-- Search bar -->
            <div class="flex flex-1 h-9 items-center gap-2.5 rounded-[10px] bg-[#ebebeb] p-2.5">
                <img src="{% static 'monitoring/icons/frame-10.svg' %}" class="w-[23px] h-6" alt="">
                <span class="font-['Arial-Regular',_sans-serif] text-base text-[#9a9a9a]">
                    Search for a Project
                </span>
            </div>

            <!-- Notification bell + menu dots -->
            <div class="flex flex-1 items-center justify-end gap-3 p-2.5">
                <img src="{% static 'monitoring/icons/bell0.svg' %}" class="w-[26px] h-[26px]" alt="Notifications">
                <div class="flex flex-col items-center gap-0.5 px-2">
                    <span class="w-[5px] h-[5px] rounded-full bg-[#848484]"></span>
                    <span class="w-[5px] h-[5px] rounded-full bg-[#848484]"></span>
                    <span class="w-[5px] h-[5px] rounded-full bg-[#848484]"></span>
                </div>
            </div>

            <!-- User avatar -->
            <div class="relative w-10 h-10">
                <div class="w-[39px] h-[39px] rounded-full bg-[#d9d9d9]"></div>
                <img
                    src="{% static 'monitoring/icons/user1.svg' %}"
                    class="absolute left-[9px] top-[9px] w-[23px] h-[23px]"
                    alt="User avatar"
                >
            </div>
        </header>

        <!-- ============================== -->
        <!-- BODY: SIDEBAR + MAIN CONTENT    -->
        <!-- ============================== -->
        <div class="flex w-full h-[912px] overflow-hidden">

            <!-- Sidebar -->
            <nav class="flex w-[54px] h-full flex-col items-center gap-4 bg-[#09aced] py-[22px]">
                <img src="{% static 'monitoring/icons/dashboard0.svg' %}" class="w-6 h-6" alt="Dashboard">
                <img src="{% static 'monitoring/icons/projects0.svg' %}" class="w-6 h-6" alt="Projects">
                <img src="{% static 'monitoring/icons/funding0.svg' %}" class="w-6 h-6" alt="Funding">
                <img src="{% static 'monitoring/icons/msme0.svg' %}" class="w-6 h-6" alt="MSME">
                <img src="{% static 'monitoring/icons/reports0.svg' %}" class="w-6 h-6" alt="Reports">
                <img src="{% static 'monitoring/icons/settings0.svg' %}" class="w-6 h-6 mt-auto" alt="Settings">
            </nav>

            <!-- Main content -->
            <main class="flex-1 h-[912px] overflow-hidden bg-white px-[15px] py-2.5">
                <div class="flex h-full flex-col gap-2.5 rounded-[20px] bg-[#eeeeee]">

                    <!-- Page header: title + action buttons -->
                    <div class="flex h-[109px] items-center justify-center gap-2.5 p-[5px]">

                        <h1 class="flex-1 text-center font-['Arial-Regular',_sans-serif] text-[40px] text-black">
                            Dashboard
                        </h1>

                        <div class="flex w-[1104px] items-center justify-end gap-5 px-5">

                            <!-- Add Project button -->
                            <button
                                class="flex h-12 w-40 items-center justify-center gap-2.5 rounded-[40px] py-4"
                                style="background: linear-gradient(270deg, rgba(53,185,254,1) 0%, rgba(123,139,253,1) 100%);"
                            >
                                <img src="{% static 'monitoring/icons/frame-90.svg' %}" class="w-[21px] h-[19px]" alt="">
                                <span class="font-['Outfit-Regular',_sans-serif] text-lg text-white">
                                    Add Project
                                </span>
                            </button>

                            <!-- Import Data button (gradient border, white fill) -->
                            <button class="h-12 w-40 rounded-full bg-gradient-to-r from-[#7B8BFD] to-[#35B9FE] p-[2px]">
                                <div class="flex h-full w-full items-center justify-center rounded-full bg-white">
                                    <span class="bg-gradient-to-r from-[#7B8BFD] to-[#35B9FE] bg-clip-text font-['Outfit-Regular',_sans-serif] text-lg text-transparent">
                                        Import Data
                                    </span>
                                </div>
                            </button>

                        </div>
                    </div>

                    <!-- Stat cards row -->
                    <div class="flex h-[207px] items-center gap-2.5 px-5 py-2.5">

                        <!-- Total Projects (highlighted, gradient card) -->
                        <div
                            class="flex flex-1 flex-col gap-2.5 self-stretch rounded-[20px] p-2.5"
                            style="background: linear-gradient(180deg, rgba(122,139,253,1) 0%, rgba(65,188,253,1) 100%);"
                        >
                            <div class="flex h-[47px] items-center gap-6 p-2.5">
                                <span class="flex-1 font-['Inter-Medium',_sans-serif] text-2xl font-medium text-white">
                                    Total Projects
                                </span>
                                <img src="{% static 'monitoring/icons/forward0.svg' %}" class="w-[30px] h-[30px]" alt="">
                            </div>
                            <div class="flex h-[74px] items-center p-2.5">
                                <span class="font-['Inter-SemiBold',_sans-serif] text-[64px] font-semibold text-white">
                                    5
                                </span>
                            </div>
                        </div>

                        <!-- Active -->
                        <div class="flex flex-1 flex-col gap-2.5 self-stretch rounded-[20px] bg-white p-2.5">
                            <div class="flex h-[47px] items-center gap-6 p-2.5">
                                <span class="flex-1 font-['Inter-Medium',_sans-serif] text-2xl font-medium text-black">
                                    Active
                                </span>
                                <img src="{% static 'monitoring/icons/forward1.svg' %}" class="w-[30px] h-[30px]" alt="">
                            </div>
                            <div class="flex h-[74px] items-center p-2.5">
                                <span class="font-['Inter-SemiBold',_sans-serif] text-[64px] font-semibold text-black">
                                    5
                                </span>
                            </div>
                        </div>

                        <!-- Completed -->
                        <div class="flex flex-1 flex-col gap-2.5 self-stretch rounded-[20px] bg-white p-2.5">
                            <div class="flex h-[47px] items-center gap-6 p-2.5">
                                <span class="flex-1 font-['Inter-Medium',_sans-serif] text-2xl font-medium text-black">
                                    Completed
                                </span>
                                <img src="{% static 'monitoring/icons/forward2.svg' %}" class="w-[30px] h-[30px]" alt="">
                            </div>
                            <div class="flex h-[74px] items-center p-2.5">
                                <span class="font-['Inter-SemiBold',_sans-serif] text-[64px] font-semibold text-black">
                                    0
                                </span>
                            </div>
                        </div>

                        <!-- Delayed -->
                        <div class="flex flex-1 flex-col gap-2.5 self-stretch rounded-[20px] bg-white p-2.5">
                            <div class="flex h-[47px] items-center gap-6 p-2.5">
                                <span class="flex-1 font-['Inter-Medium',_sans-serif] text-2xl font-medium text-black">
                                    Delayed
                                </span>
                                <img src="{% static 'monitoring/icons/forward3.svg' %}" class="w-[30px] h-[30px]" alt="">
                            </div>
                            <div class="flex h-[74px] items-center p-2.5">
                                <span class="font-['Inter-SemiBold',_sans-serif] text-[64px] font-semibold text-black">
                                    0
                                </span>
                            </div>
                        </div>

                        <!-- Pending -->
                        <div class="flex flex-1 flex-col gap-2.5 self-stretch rounded-[20px] bg-white p-2.5">
                            <div class="flex h-[47px] items-center gap-6 p-2.5">
                                <span class="flex-1 font-['Inter-Medium',_sans-serif] text-2xl font-medium text-black">
                                    Pending
                                </span>
                                <img src="{% static 'monitoring/icons/forward4.svg' %}" class="w-[30px] h-[30px]" alt="">
                            </div>
                            <div class="flex h-[74px] items-center p-2.5">
                                <span class="font-['Inter-SemiBold',_sans-serif] text-[64px] font-semibold text-black">
                                    0
                                </span>
                            </div>
                        </div>

                    </div>

                    <!-- Placeholder panels (empty in original — fill in with charts/tables later) -->
                    <div class="h-[388px] rounded-[32px] p-2.5"></div>
                    <div class="h-[388px] rounded-[32px] p-2.5"></div>

                </div>
            </main>

        </div>
    </div>

</body>
</html>
